name: SANAI web patch (OTA)
on:
  push:
    branches: [main]
    paths: ['ota/release.json']
  workflow_dispatch:
    inputs:
      native_version:
        description: 'Target installed APK versionCode, e.g. 71'
        required: true
        default: '71'
      revision:
        description: 'Increasing positive patch revision'
        required: true
      notes:
        description: 'Patch description'
        required: true
permissions:
  contents: write
concurrency:
  group: sanai-ota-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve patch release parameters
        env:
          INPUT_VERSION: ${{ inputs.native_version }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          python - <<'PY'
          import json, os
          cfg=json.load(open('ota/release.json')) if os.environ['GITHUB_EVENT_NAME']=='push' else {'nativeVersion':os.environ['INPUT_VERSION'],'revision':os.environ['INPUT_REVISION'],'notes':os.environ['INPUT_NOTES']}
          v,r=int(cfg['nativeVersion']),int(cfg['revision'])
          n=cfg['notes']
          assert v>0 and r>0 and isinstance(n,str) and n.strip() and '\n' not in n and '\r' not in n
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'NATIVE_VERSION={v}\nREVISION={r}\nNOTES={n}\n')
          PY
      - name: Test and sign patch
        env:
          SANAI_KEYSTORE_B64: ${{ secrets.SANAI_KEYSTORE_B64 }}
          SANAI_STORE_PASSWORD: ${{ secrets.SANAI_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SANAI_KEYSTORE_B64" && test -n "$SANAI_STORE_PASSWORD"
          test "$NATIVE_VERSION" = 71 # current patch targets V6.4.4
          node --check ota/patch.js
          node tests/widget-snapshot.cjs
          node tests/snack-recommendations.cjs
          export SANAI_KEYSTORE="$RUNNER_TEMP/sanai.p12"
          trap 'rm -f "$SANAI_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$SANAI_KEYSTORE_B64" | base64 --decode > "$SANAI_KEYSTORE"
          openssl pkcs12 -in "$SANAI_KEYSTORE" -clcerts -nokeys -passin env:SANAI_STORE_PASSWORD | openssl x509 -outform DER | sha256sum | grep -qi 'c33f45fd2ab658df9723d113ba4b35c5b72fab87d8e7f696e423a6bc4a686b13'
          mkdir -p release
          cp ota/patch.js release/patch.js
          python scripts/release.py ota release/patch.js release --version "$NATIVE_VERSION" --revision "$REVISION" --notes "$NOTES"
      - name: Publish to fixed OTA channel (not latest APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ota-channel >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/current-ota"
            if gh release download ota-channel --pattern ota.json --dir "$RUNNER_TEMP/current-ota"; then
              python - "$RUNNER_TEMP/current-ota/ota.json" release/ota.json <<'PY'
          import json,sys
          old,new=(json.load(open(p)) for p in sys.argv[1:])
          assert new['nativeVersion']>old['nativeVersion'] or (new['nativeVersion']==old['nativeVersion'] and new['revision']>old['revision']), 'Refusing older or repeated OTA'
          PY
            else
              echo 'Existing OTA channel has no readable metadata; refusing overwrite.'
              exit 1
            fi
          fi
          gh release view ota-channel >/dev/null 2>&1 || gh release create ota-channel --target "$GITHUB_SHA" --prerelease --latest=false --title 'SANAI OTA channel' --notes 'Signed web patches'
          gh release upload ota-channel release/patch.js release/ota.sig release/ota.json --clobber
