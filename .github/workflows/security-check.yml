name: SANAI security candidate checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/security-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify SDK 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Static security and regression checks
        run: |
          node tests/security-hardening.cjs
          node tests/unified-food-search.cjs
          node tests/widget-snapshot.cjs
          node tests/snack-recommendations.cjs
          node tests/free-food-entry.cjs
          node tests/food-sync.cjs
          mkdir -p /tmp/sanai-geometry-test
          javac -d /tmp/sanai-geometry-test app/src/main/java/club/sanai/app/ChadGeometry.java tests/ChadGeometryTest.java
          java -cp /tmp/sanai-geometry-test club.sanai.app.ChadGeometryTest
      - name: Compile Android candidate without release signing
        run: gradle --no-daemon :app:assembleDebug
