name: SANAI food sync validation
on:
  pull_request:
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/java/club/sanai/app/**'
      - 'app/build.gradle'
      - 'tools/food_sync_encrypt.py'
      - '.github/workflows/food-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-35'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static + encryption tests
        run: |
          node --check app/src/main/assets/sanai-food-sync.js
          node tests/widget-snapshot.cjs
          node tests/snack-recommendations.cjs
          python3 -m pip install --user cryptography==46.0.4
          python3 tools/food_sync_encrypt.py --self-test
      - name: Compile unsigned debug APK
        run: gradle --no-daemon :app:assembleDebug
